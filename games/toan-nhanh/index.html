<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Toán Nhanh — FunPlay World</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff;font-family:system-ui,Arial,sans-serif}.wrap{max-width:700px;width:calc(100% - 24px);margin:auto;padding:20px 0 40px}a{color:#b9adff;text-decoration:none}.panel{margin-top:18px;background:#121a2e;border:1px solid #ffffff14;border-radius:20px;padding:clamp(18px,5vw,30px);text-align:center}.top{display:flex;justify-content:space-between}.muted{color:#aab6d3}h1{font-size:2rem;margin:18px 0 8px}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{background:#1b2640;padding:10px 14px;border-radius:12px}.question{font-size:clamp(2.8rem,10vw,4.6rem);font-weight:900;margin:28px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer,.btn{border:1px solid #ffffff20;border-radius:13px;padding:15px;background:#1b2640;color:white;font-size:1.2rem;font-weight:800;cursor:pointer}.answer:hover{background:#7c5cff}.btn{background:#7c5cff;border:0;margin-top:16px;font-size:1rem}.message{min-height:26px;margin-top:12px;color:#36d8c5;font-weight:700}
</style></head><body><main class="wrap"><div class="top"><a href="../../">← FunPlay World</a><span class="muted">⚡ Casual</span></div><section class="panel"><h1>➗ Toán Nhanh</h1><p class="muted">Trả lời đúng càng nhiều câu càng tốt trong 60 giây.</p><div class="stats"><div class="stat">⏱️ <b id="time">60</b>s</div><div class="stat">⭐ Điểm: <b id="score">0</b></div><div class="stat">🏆 Kỷ lục: <b id="best">0</b></div></div><div class="question" id="question">Sẵn sàng?</div><div class="answers" id="answers"></div><div class="message" id="message" aria-live="polite">Nhấn “Bắt đầu” để chơi.</div><button class="btn" id="start">Bắt đầu</button></section></main><script>
let score=0,time=60,answer=0,timer=null,playing=false,best=Number(localStorage.getItem('funplay-math-best')||0);const $=id=>document.getElementById(id);$('best').textContent=best;
function makeQuestion(){let a=Math.floor(Math.random()*12)+1,b=Math.floor(Math.random()*12)+1,op=Math.random()<.5?'+':'−';if(op==='−'&&b>a)[a,b]=[b,a];answer=op==='+'?a+b:a-b;$('question').textContent=`${a} ${op} ${b} = ?`;let opts=new Set([answer]);while(opts.size<4){let n=answer+Math.floor(Math.random()*11)-5;if(n>=0)opts.add(n)}let arr=[...opts].sort(()=>Math.random()-.5);$('answers').innerHTML='';arr.forEach(n=>{let btn=document.createElement('button');btn.className='answer';btn.textContent=n;btn.addEventListener('click',()=>choose(n));$('answers').appendChild(btn)})}
function choose(n){if(!playing)return;if(n===answer){score++;$('score').textContent=score;$('message').textContent='Chính xác! +1 điểm';}else{$('message').textContent='Chưa đúng — thử câu tiếp theo!'}makeQuestion()}
function end(){playing=false;clearInterval(timer);$('question').textContent='Hết giờ!';$('answers').innerHTML='';$('message').textContent=`Bạn đạt ${score} điểm. ${score>best?'Kỷ lục mới!':''}`;if(score>best){best=score;localStorage.setItem('funplay-math-best',best);$('best').textContent=best}$('start').textContent='Chơi lại'}
$('start').addEventListener('click',()=>{clearInterval(timer);score=0;time=60;playing=true;$('score').textContent=0;$('time').textContent=time;$('start').textContent='Đang chơi…';$('message').textContent='Cố lên!';makeQuestion();timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)end()},1000)});$('answers').innerHTML='';
</script></body></html>
