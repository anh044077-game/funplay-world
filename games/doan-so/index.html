<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đoán Số May Mắn — FunPlay World</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        .back-link {
            display: inline-block;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 20px;
            float: left;
        }
        .back-link:hover { color: var(--accent-color); }
        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
            margin-top: 20px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent-color); }
        p { color: var(--text-muted); margin-bottom: 20px; font-size: 0.95rem; }
        input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: var(--accent-color); }
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
        }
        button:hover { background: var(--accent-hover); }
        .message { margin-top: 15px; font-weight: 500; font-size: 1.1rem; }
    </style>
</head>
<body>
    <!-- Nút quay về trang chủ (Lưu ý dấu ../../ để lùi về thư mục gốc) -->
    <a href="../../index.html" class="back-link">&larr; FunPlay World</a>
    <div style="clear: both;"></div>

    <div class="game-card">
        <h1>🎯 Đoán Số May Mắn</h1>
        <p>Tìm con số bí mật từ 1 đến 100 trong số ít lượt đoán nhất!</p>
        
        <input type="number" id="userGuess" placeholder="Nhập số từ 1 - 100" min="1" max="100">
        <button onclick="checkGuess()">Đoán Ngay</button>
        
        <div class="message" id="message"></div>
        <p id="attempts" style="margin-top: 15px; font-size: 0.85rem;">Số lần đoán: 0</p>
    </div>

    <script>
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            const guess = parseInt(document.getElementById('userGuess').value);
            const msg = document.getElementById('message');
            const att = document.getElementById('attempts');

            if (!guess || guess < 1 || guess > 100) {
                msg.style.color = '#ef4444';
                msg.innerText = '⚠️ Vui lòng nhập số hợp lệ từ 1 đến 100!';
                return;
            }

            attempts++;
            att.innerText = `Số lần đoán: ${attempts}`;

            if (guess === secretNumber) {
                msg.style.color = '#22c55e';
                msg.innerText = `🎉 Chính xác! Số bí mật là ${secretNumber}. Bạn đã thắng sau ${attempts} lần đoán!`;
            } else if (guess < secretNumber) {
                msg.style.color = '#f59e0b';
                msg.innerText = '📈 Số bí mật lớn hơn thế này!';
            } else {
                msg.style.color = '#3b82f6';
                msg.innerText = '📉 Số bí mật nhỏ hơn thế này!';
            }
        }
    </script>
</body>
</html>
