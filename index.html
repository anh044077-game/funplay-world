<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Thử Thách Trí Nhớ — FunPlay World</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff;font-family:system-ui,Arial,sans-serif}.wrap{max-width:780px;width:calc(100% - 24px);margin:auto;padding:20px 0 40px}a{color:#b9adff;text-decoration:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.panel{background:#121a2e;border:1px solid #ffffff14;border-radius:20px;padding:20px;margin-top:18px}h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:12px 0 6px}.muted{color:#aab6d3}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#1b2640;padding:10px 14px;border-radius:12px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.card{aspect-ratio:1;border:1px solid #ffffff22;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#4569d8);font-size:clamp(1.7rem,6vw,3rem);cursor:pointer;display:grid;place-items:center;transition:transform .15s}.card:hover{transform:translateY(-2px)}.card.open,.card.matched{background:#182c3b;border-color:#36d8c5}.card.matched{box-shadow:inset 0 0 0 2px #36d8c566}.btn{border:0;border-radius:11px;padding:11px 15px;background:#7c5cff;color:white;font-weight:800;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}@media(max-width:430px){.board{gap:7px}.panel{padding:14px}}
</style></head><body><main class="wrap"><div class="top"><a href="../../">← FunPlay World</a><span class="muted">🧩 Puzzle</span></div><div class="panel"><h1>🧠 Thử Thách Trí Nhớ</h1><p class="muted">Lật hai thẻ mỗi lượt để tìm cặp hình giống nhau. Ghép đủ 8 cặp với ít lượt đi nhất nhé!</p><div class="stats"><div class="stat">Lượt đi: <b id="moves">0</b></div><div class="stat">Đã ghép: <b id="pairs">0</b>/8</div><div class="stat">Kỷ lục: <b id="best">—</b></div></div><div class="board" id="board"></div><div class="actions"><button class="btn" id="restart">Chơi lại</button><span class="muted" id="message" aria-live="polite"></span></div></div></main><script>
const symbols=['🐸','🍉','🚀','🐼','🌈','🍓','🦊','⭐'];let deck=[],first=null,lock=false,moves=0,pairs=0,best=Number(localStorage.getItem('funplay-memory-best')||0);const board=document.getElementById('board');
document.getElementById('best').textContent=best?best+' lượt':'—';
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){deck=shuffle([...symbols,...symbols]);first=null;lock=false;moves=0;pairs=0;document.getElementById('moves').textContent='0';document.getElementById('pairs').textContent='0';document.getElementById('message').textContent='';board.innerHTML='';deck.forEach((s,i)=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-label','Thẻ úp');b.dataset.symbol=s;b.dataset.index=i;b.textContent='?';b.addEventListener('click',()=>flip(b));board.appendChild(b)})}
function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');b.textContent=b.dataset.symbol;b.setAttribute('aria-label',b.dataset.symbol);if(!first){first=b;return}moves++;document.getElementById('moves').textContent=moves;if(first.dataset.symbol===b.dataset.symbol){first.classList.add('matched');b.classList.add('matched');first=null;pairs++;document.getElementById('pairs').textContent=pairs;if(pairs===8){document.getElementById('message').textContent='🎉 Tuyệt vời! Bạn đã ghép đủ các cặp.';if(!best||moves<best){best=moves;localStorage.setItem('funplay-memory-best',best);document.getElementById('best').textContent=best+' lượt'}}}else{lock=true;const old=first;first=null;setTimeout(()=>{old.classList.remove('open');b.classList.remove('open');old.textContent='?';b.textContent='?';lock=false},750)}}
document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
