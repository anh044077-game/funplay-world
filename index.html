<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunPlay World - Free Online Games</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }
        .lang-switch button {
            background: var(--card-bg);
            border: 1px solid #475569;
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .lang-switch button:hover {
            border-color: var(--accent-color);
        }
        .hero {
            text-align: center;
            margin-bottom: 24px;
        }
        .hero h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
        }
        .hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .search-box {
            width: 100%;
            padding: 10px 16px;
            background: var(--card-bg);
            border: 1px solid #475569;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 24px;
            padding-bottom: 4px;
        }
        .category-btn {
            background: var(--card-bg);
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        .category-btn.active, .category-btn:hover {
            background: var(--accent-color);
            color: white;
        }
        .section-title {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }
        .game-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
        }
        .game-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .game-name {
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: var(--text-color);
        }
        .play-btn {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            width: 100%;
        }
        .play-btn:hover {
            background: var(--accent-hover);
        }
        footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #334155;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        footer a {
            color: var(--text-muted);
            text-decoration: none;
            margin: 0 8px;
        }
        footer a:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🎮 FunPlay World</a>
        <div class="lang-switch">
            <button onclick="toggleLang()" id="langBtn">EN / VI</button>
        </div>
    </header>

    <div class="hero">
        <h1 id="heroTitle">Trò Chơi Trực Tuyến Miễn Phí</h1>
        <p id="heroDesc">Thư giãn mọi lúc, mọi nơi với các trò chơi nhanh gọn</p>
        <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm trò chơi..." onkeyup="searchGames()">
    </div>

    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('all')" id="catAll">Tất cả</button>
        <button class="category-btn" onclick="filterCategory('adventure')" id="catAdv">Phiêu lưu</button>
        <button class="category-btn" onclick="filterCategory('brain')" id="catBrain">Trí tuệ</button>
        <button class="category-btn" onclick="filterCategory('puzzle')" id="catPuzzle">Giải đố</button>
    </div>

    <div class="section-title" id="featuredTitle">Trò chơi nổi bật</div>
    
    <div class="games-grid" id="gamesGrid">
        <!-- Game 1 -->
        <div class="game-card" data-category="adventure" data-name-vi="Hành Trình Phiêu Lưu" data-name-en="Adventure Journey">
            <div class="game-icon">🚀</div>
            <div class="game-name">Hành Trình Phiêu Lưu</div>
            <a href="games/hanh-trinh/index.html" class="play-btn" data-play="Chơi ngay">Chơi ngay</a>
        </div>
        <!-- Game 2 -->
        <div class="game-card" data-category="brain" data-name-vi="Trí Nhớ" data-name-en="Memory Match">
            <div class="game-icon">🧠</div>
            <div class="game-name">Trí Nhớ</div>
            <a href="games/tri-nho/index.html" class="play-btn" data-play="Chơi ngay">Chơi ngay</a>
        </div>
        <!-- Game 3 -->
        <div class="game-card" data-category="brain" data-name-vi="Toán Nhanh" data-name-en="Quick Math">
            <div class="game-icon">🔢</div>
            <div class="game-name">Toán Nhanh</div>
            <a href="games/toan-nhanh/index.html" class="play-btn" data-play="Chơi ngay">Chơi ngay</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 FunPlay World. All rights reserved.</p>
        <div style="margin-top: 8px;">
            <a href="about.html" id="linkAbout">Giới thiệu</a> | 
            <a href="contact.html" id="linkContact">Liên hệ</a> | 
            <a href="privacy.html" id="linkPrivacy">Quyền riêng tư</a>
        </div>
    </footer>

    <script>
        let currentLang = 'vi';

        const translations = {
            vi: {
                heroTitle: "Trò Chơi Trực Tuyến Miễn Phí",
                heroDesc: "Thư giãn mọi lúc, mọi nơi với các trò chơi nhanh gọn",
                searchPlaceholder: "Tìm kiếm trò chơi...",
                catAll: "Tất cả",
                catAdv: "Phiêu lưu",
                catBrain: "Trí tuệ",
                catPuzzle: "Giải đố",
                featuredTitle: "Trò chơi nổi bật",
                playBtn: "Chơi ngay",
                linkAbout: "Giới thiệu",
                linkContact: "Liên hệ",
                linkPrivacy: "Quyền riêng tư"
            },
            en: {
                heroTitle: "Free Online Games",
                heroDesc: "Play fun and casual games anytime, anywhere",
                searchPlaceholder: "Search games...",
                catAll: "All",
                catAdv: "Adventure",
                catBrain: "Brain",
                catPuzzle: "Puzzle",
                featuredTitle: "Featured Games",
                playBtn: "Play Now",
                linkAbout: "About",
                linkContact: "Contact",
                linkPrivacy: "Privacy Policy"
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'vi' ? 'en' : 'vi';
            const t = translations[currentLang];
            
            document.getElementById('heroTitle').innerText = t.heroTitle;
            document.getElementById('heroDesc').innerText = t.heroDesc;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('catAll').innerText = t.catAll;
            document.getElementById('catAdv').innerText = t.catAdv;
            document.getElementById('catBrain').innerText = t.catBrain;
            document.getElementById('catPuzzle').innerText = t.catPuzzle;
            document.getElementById('featuredTitle').innerText = t.featuredTitle;
            document.getElementById('linkAbout').innerText = t.linkAbout;
            document.getElementById('linkContact').innerText = t.linkContact;
            document.getElementById('linkPrivacy').innerText = t.linkPrivacy;

            // Cập nhật tên game và nút chơi theo ngôn ngữ
            document.querySelectorAll('.game-card').forEach(card => {
                const nameDiv = card.querySelector('.game-name');
                const playBtn = card.querySelector('.play-btn');
                if (currentLang === 'en') {
                    nameDiv.innerText = card.getAttribute('data-name-en');
                } else {
                    nameDiv.innerText = card.getAttribute('data-name-vi');
                }
                playBtn.innerText = t.playBtn;
            });
        }

        function searchGames() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                let nameVi = card.getAttribute('data-name-vi').toLowerCase();
                let nameEn = card.getAttribute('data-name-en').toLowerCase();
                if (nameVi.includes(query) || nameEn.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
